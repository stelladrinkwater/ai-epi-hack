<section id="completed-cases-chart" data-viz-composition>
  <div data-viz-container></div>
  <script type="application/json" data-viz-chart>
    {
      "id": "completed-cases-by-model",
      "title": "Completed cases by model",
      "description": "The partial run contains 36 of 84 expected cases. GPT-4.1, Claude Sonnet 4.6, and Gemini 3.8 Flash have 12 completed cases each; the other four models have none yet.",
      "summary": "36 of 84 cases completed.",
      "height": 320,
      "spec": {
        "type": "horizontalBar",
        "y": "Model",
        "x": "Completed cases",
        "xLabel": "Completed cases",
        "xDomain": [0, 12],
        "showValues": true
      },
      "columns": ["Model", "Completed cases"],
      "rows": [
        ["GPT-4.1", 12],
        ["Claude Sonnet 4.6", 12],
        ["Gemini 3.8 Flash", 12],
        ["Grok 4.3", 0],
        ["GLM 5.3 Flash", 0],
        ["Step 3.5 Flash", 0],
        ["Llama 4 Scout", 0]
      ]
    }
  </script>
</section>
<script type="module">
  import { mountChart } from "https://persistent.oaistatic.com/plugins/visualize/charts/1.2.3/element.js";
  const root = document.getElementById("completed-cases-chart");
  const config = JSON.parse(root.querySelector("[data-viz-chart]").textContent);
  mountChart(root.querySelector("[data-viz-container]"), config);
</script>
