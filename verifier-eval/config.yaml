# Configuration for the SciFact verifier-degradation study (Task 1).
# All relative paths are resolved against the directory containing this file.

# Single explicit seed for every random choice (subset sampling, opaque ids).
# I chose this value; change it and rebuild to get a different subset.
seed: 20261114

data:
  name: scifact
  # Official release (the same tarball the Hugging Face `allenai/scifact`
  # script downloads). Hash verified before extraction.
  source_url: https://scifact.s3-us-west-2.amazonaws.com/release/latest/data.tar.gz
  source_sha256: 11c621288d41ac144d29b13b0f8503b3820b7d6e8b1f6ff24dff335c196d76be
  raw_dir: data/raw/scifact
  # train + dev are labeled; test is unlabeled and has no associated abstracts.
  splits: [train, dev]
  files:
    corpus: corpus.jsonl
    claims: claims_{split}.jsonl
  output:
    verifier_input: data/verifier_input.jsonl
    gold: data/gold.jsonl
    key: data/key.jsonl
    hashes: data/HASHES.txt

subset:
  per_label:
    SUPPORT: 50
    REFUTE: 50
    NEI: 50
  id_prefix: c_
  id_hex_len: 10

# Opus 5.5 manual pilot (SPEC §3). Separate seed key and its own RNG stream;
# these claims are nested inside the 150 and frozen before any DeepSeek result.
pilot:
  seed: 20261114
  per_class: 10

# Smoke test (TASK A2): sampling check on 6 claims disjoint from the main 150.
# Separate seed key, so the main 150 and the pilot draw are untouched.
smoke:
  seed: 20261115

# Persistent response cache (SPEC §7). Outside OneDrive so sync does not
# corrupt in-flight writes; created on demand.
cache:
  dir: "../../.epistemics-eval/cache"

# Programmatic condition construction (SPEC v1.3.1 §5).
m2:
  seed: 20261116
  positions: [start, middle, end]
  families: [direct_command, disguised_note, ready_json]
  joiner: " "
  nei_push_split: 0.5
c1:
  n_sentences: 6

# Manual audit sheets (no model calls).
audit:
  seed: 20261117

# Experiment runner (scripts/run_experiment.py). order_seed is null until the
# human sets it; a real run refuses to start while it is null.
run:
  conditions_core: [C0, C0p, C2, M1, M2]
  conditions_extended: [C1, C_closed]
  k: 5
  order_seed: 20261118
  tag_required: spec-frozen
  shards: 1
  # Logs live outside the repo and outside OneDrive (SPEC v1.5 §7): one log
  # per tier and prompt variant under <results_dir>/raw/.
  results_dir: "../../epistemics-eval-results"

# Main subject (SPEC §3). Values marked null are not set yet; the call layer
# raises a ConfigError naming the key instead of inventing a default.
models:
  deepseek:
    base_url: https://api.deepseek.com   # official OpenAI-format endpoint
    model: deepseek-flash                # official ids: deepseek-flash | deepseek-v4-pro
    api_key_env: DEEPSEEK_API_KEY
    temperature: 0.7
    top_p: null
    max_tokens: 512
    thinking:
      enabled: false
      budget_tokens: null
    concurrency: 32      # maximum in-flight independent verifier calls
    # 5 attempts = 4 retries, per SPEC v1.1 (exponential backoff, 60 s cap).
    max_retries: 4
    # Retry policy (SPEC v1.1): only listed outcomes are retried. The main run
    # retries API errors only; a parse failure is an outcome and is not retried.
    retry_on: [api_error]
    # Provider bodies that mean a content refusal rather than a bad request
    # (unverified wording; matched case-insensitively as a substring).
    blocked_body_markers: ["content exists risk"]
    # Official pricing (accessed 2026-11-14):
    # https://api-docs.deepseek.com/quick_start/pricing
    # deepseek-flash: input $0.15 off-peak / $0.30 peak per 1M tokens,
    # output $0.60 off-peak / $1.20 peak. The 2x peak/off-peak difference
    # means one input/output table would misstate runs at the other rate, so
    # this stays null and cost is omitted rather than guessed.
    price_table: null
